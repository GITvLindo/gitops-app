apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-nginx
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/GITvLindo/gitops-app.git
    targetRevision: main
    path: helm/nginx
    helm:
      releaseName: helm-nginx

  destination:
    server: https://kubernetes.default.svc
    namespace: helm-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true